name: Build and Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

# env:
#   VERSION: "${{ github.ref_name }}"

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        architecture: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4

      - name: Hadolint Dockerfile
        continue-on-error: true
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: extras/debian.Dockerfile

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: docker_buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        id: docker_login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build_push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/${{ matrix.architecture }}
          push: true
          file: extras/debian.Dockerfile
          outputs: out
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ env.VERSION }},
                ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Copy compiled binary
        run: cp out/app/sbin/gluster-exporter gluster-exporter-${{ matrix.architecture }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gluster-exporter-${{ matrix.architecture }}
          path: gluster-exporter-${{ matrix.architecture }}

  create-release:
    runs-on: ubuntu-latest
    needs: build-push
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

  upload:
    runs-on: ubuntu-latest
    needs: create-release
    strategy:
      matrix:
        architecture: [arm64, amd64]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: gluster-exporter-${{ matrix.architecture }}

      - name: Upload ${{ matrix.architecture }} artifact
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: gluster-exporter-${{ matrix.architecture }}
          asset_name: gluster-exporter-${{ matrix.architecture }}
          asset_content_type: application
